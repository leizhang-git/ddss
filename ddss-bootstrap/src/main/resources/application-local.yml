# ==================== 本地兜底配置（Nacos 不可用时使用） ====================
# 启动方式：java -jar xxx.jar --spring.profiles.active=local
# 或设置环境变量：SPRING_PROFILES_ACTIVE=local

ddss:
  name: ddss
  version: 1.0.0
  copyrightYear: 2025
  profile: D:/ddss/uploadPath
  addressEnabled: false
  captchaType: math

server:
  port: 8088
  servlet:
    context-path: /
  tomcat:
    uri-encoding: UTF-8
    accept-count: 1000
    threads:
      max: 800
      min-spare: 100

logging:
  level:
    com.ddss: debug
    org.springframework: warn

user:
  password:
    maxRetryCount: 5
    lockTime: 10

spring:
  messages:
    basename: i18n/messages
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  devtools:
    restart:
      enabled: true
  datasource:
    druid:
      initial-size: 5
      min-idle: 5
      maxActive: 20
      maxWait: 60000
      connectTimeout: 30000
      socketTimeout: 60000
      timeBetweenEvictionRunsMillis: 60000
      minEvictableIdleTimeMillis: 300000
      validationQuery: SELECT 1 FROM DUAL
      testWhileIdle: true
      testOnBorrow: false
      testOnReturn: false
      poolPreparedStatements: true
      maxPoolPreparedStatementPerConnectionSize: 20
      filters: stat,slf4j
      stat-view-servlet:
        enabled: true
        loginUsername: admin
        loginPassword: 123456
    dynamic:
      primary: master
      datasource:
        master:
          url: jdbc:mysql://192.168.83.100:3306/ddss?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8
          username: root
          password: 123456
          driver-class-name: com.mysql.cj.jdbc.Driver
        ddss:
          url: jdbc:mysql://192.168.83.100:3306/ddss?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8
          username: root
          password: 123456
          driver-class-name: com.mysql.cj.jdbc.Driver
  redis:
    sentinel:
      master: mymaster
      nodes: 192.168.83.100:26379,192.168.83.100:26380,192.168.83.100:26381
    password: 123456
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
        max-wait: -1ms
    timeout: 10000ms
  kafka:
    producer:
      bootstrap-servers: 192.168.83.100:9092
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      batch-size: 16384
      buffer-memory: 33554432
      compression-type: snappy
    consumer:
      bootstrap-servers: 192.168.83.100:9092
      group-id: ddss-server-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
      max-poll-records: 500
      auto-offset-reset: latest
    listener:
      ack-mode: MANUAL
      type: batch
      concurrency: 3

token:
  header: Authorization
  # HS512 要求密钥 >= 64 字节；生产环境务必通过 Nacos 加密配置或环境变量 TOKEN_SECRET 覆盖，并定期轮换
  secret: ZmY5N2E3YzQyLTEyMzQtNTY3OC05YWJjLWRkZWY5N2E3YzQyMTIwMjUtZGRzcy1zZWNyZXQta2V5LWhzNTEy
  expireTime: 30

mybatis:
  typeAliasesPackage: com.ddss
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  configLocation: classpath:mybatis/mybatis-config.xml

pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

swagger:
  enabled: true
  pathMapping: /dev-api

xss:
  enabled: true
  excludes: /system/notice
  urlPatterns: /system/*,/monitor/*,/tool/*

# 防盗链
referer:
  enabled: false
  allowed-domains: localhost,127.0.0.1

# 白名单
whitelist:
  urls:
    - /login
    - /register
    - /captchaImage
    - /swagger-ui.html
    - /druid/**
    - /profile/**
    - /
    - /*.html
    - /**/*.html
    - /**/*.css
    - /**/*.js

# 代码生成器
author: ddss
packageName: com.ddss
autoRemovePre: true
tablePrefix: sys_
allowOverwrite: false

minio:
  endpoint: http://192.168.83.100:9000
  access-key: admin
  secret-key: admin123
  bucket-name: app
  secure: false

xxl:
  job:
    admin:
      addresses: http://192.168.83.100:8888/xxl-job-admin
    executor:
      appname: ddss-executor
      ip:
      port: 9999
      logpath: /data/applogs/xxl-job/jobhandler
      logretentiondays: 30
    accessToken:

threadpool:
  open_flag: true
  core_pool_size: 10
  max_pool_size: 200
  queue_capacity: 400
  keep_alive_seconds: 60
  default_name: ddss-pool
  rejection_policy: CallerRunsPolicy
